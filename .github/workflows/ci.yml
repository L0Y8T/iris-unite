name: CI

# 三平台矩阵：这台开发机只有 Windows，macOS / Linux 的分支只能靠 CI 真机跑。
# 这里跑的检查只覆盖离线部分——不调用任何真实模型（不花钱、不需要密钥）。

on:
  push:
    branches: [main]
    # 没有这一行，打 tag 不会触发任何运行；打包任务的条件却是 refs/tags/，于是永远轮不到。
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试与离线界面检查（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      # Linux 的 CI 容器里 chrome-sandbox 没有 root:4755，Electron 会直接 FATAL 退出：
      #   The SUID sandbox helper binary was found, but is not configured correctly
      # 这是 CI 环境的限制，不是应用的问题；在桌面 Linux 上正常安装不会遇到。
      ELECTRON_DISABLE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 不依赖任何包：挡住「临时脚本被顺手提交」这类事故（根目录白名单 + 证书/凭据扫描）
      - name: 仓库卫生检查
        run: node scripts/check-repo-hygiene.cjs

      - name: 安装依赖
        run: npm ci

      - name: 生成界面资源（图标字体与本地渲染器）
        run: npm run prepare:ui

      - name: 单元测试（离线，不花钱）
        run: npm test

      - name: 平台分支与路径检查
        run: node --test tests/platform.test.cjs

      # Linux 上的 Electron 需要显示服务；offscreen 渲染也起不来无头的 X。
      - name: 界面与可访问性回归（Linux 用 xvfb）
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:frontend

      - name: 界面与可访问性回归（Windows / macOS）
        if: runner.os != 'Linux'
        run: npm run test:frontend

      - name: 一键导出与花费估算
        if: runner.os != 'Linux'
        run: |
          node tests/export-ui-check.cjs
          node tests/pricing-ui-check.cjs

  package:
    name: 打包（${{ matrix.os }}）
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    env:
      # 与 test job 同理：Linux runner 的 chrome-sandbox 权限不对，
      # electron-builder 内部会拉起 electron 取版本信息，没这个变量会 FATAL 退出。
      ELECTRON_DISABLE_SANDBOX: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: dist/*.exe
          - os: macos-latest
            target: --mac
            artifact: dist/*.dmg
          - os: ubuntu-latest
            target: --linux
            artifact: dist/*.AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prepare:ui
      # 未签名：Windows 会弹 SmartScreen、macOS 会被 Gatekeeper 拦一次。
      # 消除警告需要购买证书，见 README 的「平台支持」一节。
      - name: 打包
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: iris-unite-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: warn
